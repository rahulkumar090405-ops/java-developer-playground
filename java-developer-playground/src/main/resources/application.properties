# Spring Boot Application Properties
# Java Developer Playground

# Application Name
spring.application.name=java-developer-playground

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/java_playground
spring.datasource.username=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Database password from environment variable
spring.datasource.password=${DB_PASSWORD}

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Logging Configuration
logging.level.root=INFO
logging.level.com.javaplayground=DEBUG
logging.level.org.springframework.boot=INFO

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Spring Configuration
spring.lifecycle.timeout-per-shutdown-phase=30s
